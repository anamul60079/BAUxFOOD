    <style>
        * {
  margin: 0;

}
.direct-contact {
  padding: 60px 20px;
  display: flex;

.direct-contact .contact-info {

}
.formbox {
  padding: 60px 20px;
    display: flex;
    justify-content: center;
    border: 1px solid #040000;
}
.formbox .form-container {
    width: 100%;
        
        padding: 20px;
        border-radius: 30px;
        background-color: #ab1515;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align:center;
        
}

                <label for="email">Email</label><br>

                <div id="formMessage" style="margin-top: 15px; font-weight: bold;"></div>
            </form>
